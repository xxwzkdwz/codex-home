name: Test and package safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/vico-home/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: plugins/vico-home
      - name: Install isolated-broker test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes mosquitto
      - run: npm test
        working-directory: plugins/vico-home
      - run: node scripts/check-package.mjs
